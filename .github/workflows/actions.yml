name: On Feature Branch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Optionally, restrict to PRs targeting specific branches:
    # branches:
    #   - main
    #   - develop


env:
  ASTA_S_EU_SCRAPING_CORE_VERSION: 0.0.6
  ASTA_S_EU_SCRAPING_KLEINANZEIGEN_DE_VERSION: 0.2.0
  PIP_PACKAGE_NAME: asta-s-eu-scraping-kleinanzeigen-de

jobs:

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip' # caching pip dependencies
      - run: make update_pip_and_wheel install_dev
      - run: make coverage coverage_report_xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: asta-s-eu/scraping-kleinanzeigen.de

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip' # caching pip dependencies
      - run: make update_pip_and_wheel install_dev
      - run: make mypy

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip' # caching pip dependencies
      - run: make update_pip_and_wheel install_dev
      - run: make pylint

  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip' # caching pip dependencies
      - run: make update_pip_and_wheel install_dev
      - run: ARGS=--check make isort

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip' # caching pip dependencies
      - run: make update_pip_and_wheel install_dev
      - run: make pip-audit

  pypi_publish:
    if: ${{ github.ref == 'refs/heads/release/0/2/latest' && github.event.pull_request.merged == true }}
    needs:
      - coverage
      - pylint
      - mypy
      - isort
      - pip-audit
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/$PIP_PACKAGE_NAME
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'pyproject.toml'

      - run: make update_pip_and_wheel install_prod wheel

      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs:
      - pypi_publish
    runs-on: ubuntu-latest
    environment:
      name: hub.docker.com
      url: https://hub.docker.com/repositories/adan
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - run: sleep 60 # sleep 60 allowing python package to be available
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: adan/asta-s-eu-sraping-kleinanzeigen:${{ env.ASTA_S_EU_SCRAPING_KLEINANZEIGEN_DE_VERSION }}
          build-args: |
            ASTA_S_EU_SCRAPING_CORE_VERSION=${{ env.ASTA_S_EU_SCRAPING_CORE_VERSION }}
            ASTA_S_EU_SCRAPING_KLEINANZEIGEN_DE_VERSION=${{ env.ASTA_S_EU_SCRAPING_KLEINANZEIGEN_DE_VERSION }}
